name: EndoGram iOS Build
# Trigger a fresh validation build after enabling Actions.

on:
  push:
    branches:
      - master
      - "endogram/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: endofork-ipa-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 180

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select the Xcode version pinned by the source
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Prepare a stable source path
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          sudo rm -rf /Users/Shared/endogram-ios
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/endogram-ios

      - name: Build EndoGram for iOS devices
        working-directory: /Users/Shared/endogram-ios
        run: |
          set -euo pipefail

          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          # Re-sign repository-only verification profiles with the bundled fake certificate and refresh their expiry.
          PROFILE_OUTPUT="$RUNNER_TEMP/endogram-verification-profiles"
          rm -rf "$PROFILE_OUTPUT"
          mkdir -p "$PROFILE_OUTPUT"
          python3 build-system/Make/Make.py generate-verification-profiles \\
            --configurationPath="build-system/appstore-configuration.json" \\
            --codesigningInformationPath="build-system/fake-codesigning" \\
            --destination="$PROFILE_OUTPUT"
          rm -rf build-system/fake-codesigning/profiles
          cp -R "$PROFILE_OUTPUT" build-system/fake-codesigning/profiles

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          IPA_PATH="$(find bazel-out -type f -path '*/bin/Telegram/Telegram.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "Could not find the device IPA produced by Bazel."
            exit 1
          fi
          cp "$IPA_PATH" "$OUTPUT_PATH/EndoGram.ipa"

      - name: Upload EndoGram IPA
        uses: actions/upload-artifact@v4
        with:
          name: EndoGram-IPA-${{ github.run_number }}
          path: /Users/Shared/endogram-ios/build/artifacts/EndoGram.ipa
          if-no-files-found: error
          retention-days: 14
